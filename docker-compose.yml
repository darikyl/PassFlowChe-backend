services:

  postgres:
    image: postgis/postgis:16-3.4
    container_name: postgis
    environment:
      POSTGRES_DB: PassFlowCheNew
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"

  path-flow:
    build: ./path-flow
    depends_on:
      - postgres
      - rabbitmq
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/PassFlowCheNew
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_RABBITMQ_HOST: rabbitmq
    ports:
      - "8082"

  gateway:
    build: ./getAway
    ports:
      - "8080:8080"
    depends_on:
      - path-flow

volumes:
  pgdata: