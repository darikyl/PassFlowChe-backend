server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: auth-service

  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: ${RABBIT_PORT:5672}
    username: ${RABBIT_USERNAME:guest}
    password: ${RABBIT_PASSWORD:guest}

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

app:
  rabbit:
    exchange: ${RABBIT_EXCHANGE:user-exchange}
    routing-key: ${RABBIT_ROUTING_KEY:user.registered}
    queue: ${RABBIT_QUEUE:user-registration-queue}

jwt:
  secret: ${JWT_SECRET}
